[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pos"
version = "0.1.0"
description = "Oracle_N: generalizing the Oracle upper bound for Multiple Classifier Systems"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }
authors = [{ name = "POS Research" }]
keywords = ["ensemble", "oracle", "dynamic-selection", "complexity", "MCS"]

# Runtime deps are pinned in requirements.txt (UTF-16). This section mirrors them
# for tooling that reads pyproject.toml. Do not duplicate-install from both;
# `pip install -r requirements.txt` remains the canonical install path.
dependencies = [
    "scikit-learn==1.2.0",
    "numpy==1.24.1",
    "pandas==1.5.3",
    "scipy==1.10.0",
    "deap==1.3.3",
    "DESlib==0.3.5",
    "mlxtend==0.21.0",
    "matplotlib==3.6.3",
    "joblib==1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
pyhard = ["pyhard>=2.2.0"]
r = ["rpy2==3.5.7"]  # requires R + ECoL installed and R_HOME set

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=pos",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    # "--cov-fail-under=80",  # enabled once characterization suite is complete
]
markers = [
    "requires_r: needs R + ECoL + R_HOME (skipped automatically if R unavailable)",
    "requires_pyhard: needs pyhard installed (skipped automatically if unavailable)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "characterization: golden-value tests capturing current behavior before refactor",
]

# ----------------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["_legacy", "cpx_legacy.py", "pool_generation_legacy.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in defaults (common in ML libs)
    "UP035", # typing.List etc. (keep compat with 3.10)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # assert False in tests is fine

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
exclude = ["tests/characterization/", "_legacy/", "cpx_legacy.py", "pool_generation_legacy.py"]

[[tool.mypy.overrides]]
module = ["deap.*", "deslib.*", "mlxtend.*", "rpy2.*", "pyhard.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# coverage
# ----------------------------------------------------------------------------
[tool.coverage.run]
source = ["pos"]
branch = true
omit = [
    "*/__pycache__/*",
    "*/_legacy/*",
    "*/cpx_legacy.py",
    "*/pool_generation_legacy.py",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 80

# ----------------------------------------------------------------------------
# setuptools (for `pip install -e .`)
# ----------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["pos*"]
exclude = ["tests*"]
